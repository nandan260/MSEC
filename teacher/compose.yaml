services:
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4180}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8000}
      AI_API_KEY: ${AI_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    build:
      context: .
      target: backend
    restart: unless-stopped
